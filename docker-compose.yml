services:
  # Builds the site into the `site` volume, then refetches the register every UPDATE_INTERVAL_DAYS
  app:
    build: .
    restart: unless-stopped
    init: true
    shm_size: 1gb # Chromium needs more than Docker's 64 MB /dev/shm
    environment:
      BASE_PATH: /energycomp/ # public path behind the reverse proxy; use / for a (sub)domain of its own
      UPDATE_INTERVAL_DAYS: 7
      RETRY_HOURS: 6
    volumes:
      - data:/app/src/data # merged tariff history; keep this volume
      - snapshots:/app/scripts/snapshots # last 8 raw captures
      - site:/site

  # Static file server; the reverse proxy strips BASE_PATH and forwards here
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-3004}:80'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - site:/srv:ro

volumes:
  data:
  snapshots:
  site:
